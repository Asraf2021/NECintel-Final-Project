<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1F33">
  <title data-i18n="page.citizen">Təhlükəsiz Təxliyə — Vətəndaş</title>
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/citizen.css">
</head>
<body class="citizen">
  <header class="c-top">
    <a class="brand" href="/" data-i18n-title="common.back"><span class="brand-mark" id="brandMark"></span><span data-i18n="app.name">Təhlükəsiz Təxliyə</span></a>
    <div class="c-top-right">
      <span class="chip c-conn"><span class="dot" id="connDot"></span><span id="connText"></span></span>
      <div class="lang-switch" data-lang-switch role="group" data-i18n-aria="aria.lang"></div>
    </div>
  </header>

  <div class="c-layout">
    <section class="c-map" aria-label="Xəritə" data-i18n-aria="aria.map">
      <div id="map"></div>
      <div class="c-legend" id="legend"></div>
    </section>

    <aside class="c-panel" id="panel">
      <div id="banners" aria-live="assertive"></div>
      <div id="statusCard"></div>
      <section class="card acc-card" id="accountCard"></section>

      <section class="card">
        <h2 class="card-title"><span class="ti" id="icoLoc"></span><span data-i18n="loc.title">Yerləşməniz</span></h2>
        <div class="loc-row">
          <label class="sr-only" for="district" data-i18n="loc.district">Rayon seçin</label>
          <select id="district" class="select"></select>
          <button class="btn" id="gpsBtn" type="button"><span id="icoGps"></span><span data-i18n="loc.gps">Mənim yerim</span></button>
        </div>
        <p class="hint" data-i18n="loc.hint">Və ya xəritədə nöqtəyə toxunun</p>
        <label class="role-toggle" for="roleToggle">
          <span class="role-ico" id="icoWheel"></span>
          <span class="role-text"><b data-i18n="role.priority">Hərəkət məhdudiyyətim var / xüsusi qayğıya ehtiyacım var</b><small data-i18n="role.priority.desc"></small></span>
          <input type="checkbox" id="roleToggle" class="switch">
        </label>
      </section>

      <div id="planBox"></div>
    </aside>
  </div>

  <nav class="c-actions" aria-label="Təcili əməliyyatlar" data-i18n-aria="aria.actions">
    <button class="act act-sos" id="sosBtn" type="button"><span class="act-ring"></span><span class="act-label" data-i18n="sos.button">SOS</span><span class="act-badge" id="sosBadge" hidden>P1</span></button>
    <button class="act act-safe" id="safeBtn" type="button"><span id="icoSafe"></span><span data-i18n="safe.button">Təhlükəsizəm</span></button>
  </nav>

  <div class="sheet-backdrop" id="sosSheet" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sosTitle">
      <div class="sheet-grip"></div>
      <h2 id="sosTitle" data-i18n="sos.title">Təhlükədəsiniz?</h2>
      <p class="sheet-sub" data-i18n="sos.choose"></p>
      <p class="sheet-priority" id="sosPriorityNote" hidden><span id="icoWheel2"></span><span><b data-i18n="sos.priority"></b><br><span data-i18n="sos.priority_note"></span></span></p>
      <div class="sos-grid" id="sosGrid"></div>
      <label class="sr-only" for="sosNote" data-i18n="sos.note"></label>
      <input id="sosNote" class="input" maxlength="280" autocomplete="off" data-i18n-ph="sos.note">
      <button class="btn btn-block" id="sosCancel" type="button" data-i18n="sos.cancel">Bağla</button>
    </div>
  </div>

  <div class="sheet-backdrop" id="disModal" hidden>
    <div class="sheet dis-sheet" role="dialog" aria-modal="true" aria-labelledby="disTitle">
      <div class="sheet-grip"></div>
      <div class="dis-ico" id="icoWheel3"></div>
      <div id="disStep1">
        <h2 id="disTitle" data-i18n="dis.title">Əlillik statusunun təsdiqi</h2>
        <p class="sheet-sub" id="disText"></p>
        <div class="dis-btns">
          <button class="btn" type="button" id="disSkip" data-i18n="dis.skip">Keç</button>
          <button class="btn btn-primary dis-confirm" type="button" id="disConfirm" data-i18n="dis.confirm">Təsdiq et</button>
        </div>
      </div>
      <div id="disStep2" hidden>
        <h2 data-i18n="dis.step2_title_no">Arayışı myGov ilə yoxlayın</h2>
        <p class="dis-step" data-i18n="dis.step_no"></p>
        <a class="btn btn-block dis-mygov" id="disMygovLink" href="https://mygov.az" target="_blank" rel="noopener noreferrer"><span data-i18n="dis.open_mygov">myGov-da arayışı aç</span> ↗</a>
        <label class="sr-only" for="disCertNo" data-i18n="dis.cert_no"></label>
        <div class="dis-verify-row">
          <input id="disCertNo" class="input" maxlength="40" autocomplete="off" spellcheck="false" data-i18n-ph="dis.cert_no">
          <button class="btn btn-primary" type="button" id="disVerify" data-i18n="dis.verify">myGov ilə yoxla</button>
        </div>
        <p class="dis-msg" id="disMsg" role="status"></p>
        <details class="dis-file">
          <summary data-i18n="dis.or_file"></summary>
          <label class="dis-drop" for="disFile"><input type="file" id="disFile" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png"><span id="disFileName">PDF · JPG · PNG</span></label>
          <button class="btn btn-block" type="button" id="disUpload" data-i18n="dis.upload">Yüklə</button>
        </details>
        <div class="dis-btns one"><button class="btn" type="button" id="disLater" data-i18n="dis.later">Sonra</button></div>
      </div>
    </div>
  </div>

  <script src="/static/vendor/leaflet/leaflet.js"></script>
  <script src="/static/js/i18n.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/citizen.js"></script>
</body>
</html>
